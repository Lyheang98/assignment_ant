<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      .card{
        width: 450px;
      }
    </style>
  </head>
  <body>
    <!-- <h1 class="bg-primary text-white text-center p-3">login page</h1> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <div>
      <div class="container">
        <div class="card m-auto mt-5 p-4">
          <h1 class="title text-center fs-2 fw-bold">login</h1>
          <form class="my-form">
            <div class="mb-3">
              <label for="email" class="form-label">Email :</label>
              <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
              <small class="text-danger" id="email_error"></small>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password :</label>
              <input type="password" class="form-control" id="password">
              <small class="text-danger" id="password_error"></small>
            </div>
            <button type="submit" class="btn btn-dark w-100 mt-2" onclick="login()">login</button>
          </form>
        </div>
      </div>
    </div>
  </body>
  <script src="../../scripts/auth_scripts/login.js"></script>
</html>
