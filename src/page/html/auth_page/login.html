<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text-darkblue: #003879;
      }
      body {
        font-family: "Sora";
      }
      .bg-darkblue {
        background-color: var(--text-darkblue);
      }
      .bg-darkblue:hover {
        background-color: #022a57;
      }

      .text-darkblue {
        color: var(--text-darkblue);
      }
      button:disabled,
      button[disabled] {
        background-color: var(--text-darkblue) !important;
        color: #fff !important;
        opacity: 1 !important;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div
      class="d-flex justify-content-center align-items-center bg-light vh-100"
    >
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card">
              <div class="card-body p-3">
                <div class="text-center">
                  <h3 class="mt-2 fw-bold text-darkblue">Login</h3>
                  <p>Please login to your account</p>
                </div>
                <form id="forminput" onsubmit="loginpage(event)">
                  <div class="py-1 mx-3">
                    <div class="col-12 mb-3">
                      <label for="email" class="form-label text-darkblue"
                        >Email</label
                      >
                      <input
                        type="text"
                        class="form-control mb-2"
                        id="email"
                        placeholder="Enter your email"
                      />
                      <small id="email-warn" class="text-danger"></small>
                    </div>

                    <div class="col-12 mb-1">
                      <label for="pw" class="form-label text-darkblue"
                        >Password</label
                      >
                      <input
                        type="password"
                        class="form-control mb-2"
                        id="pw"
                        placeholder="Enter your password"
                      />
                      <small id="pw-warn" class="text-danger"></small>
                    </div>

                    <div class="mt-3">
                      <button
                        type="submit"
                        id="login"
                        class="form-control btn bg-darkblue bg-darkblue:hover text-white d-flex align-items-center justify-content-center gap-2"
                      >
                     
                        <i id="loginSpinner" class="fas fa-spinner fa-spin text-white opacity-75"></i>


                        <span class="btn-text">Login</span>
                      </button>
                    </div>

                    <div
                      id="invalide-input"
                      class="text-danger text-center mt-4"
                    ></div>
                    <div
                      id="success-input"
                      class="text-success text-center mt-4"
                    ></div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../../scripts/auth_scripts/login.js"></script>
  </body>
</html>
