<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Dashboard</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --text-darkblue: #003879;
        --bg-darkblue: #003879;
        --sidebar-bg: #022a57;
      }

      html,
      body {
        font-family: "Sora", sans-serif !important;
      }

      .text-darkblue {
        color: var(--text-darkblue);
      }
      a {
        text-decoration: none;
      }

      .bg-darkblue {
        background-color: var(--bg-darkblue);
      }
      .bg-darkblue:hover {
        background-color: #1bb864;
      }

      .sidebar {
        background-color: var(--sidebar-bg);
      }

      /* Mobile sidebar */
      @media (max-width: 991px) {
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          height: 100vh;
          width: 260px;
          transform: translateX(-100%);
          transition: transform 0.3s ease;
          z-index: 1050;
        }

        .sidebar.show {
          transform: translateX(0);
        }
      }
      /* ===== Skeleton Loader ===== */
      .skeleton {
        background: linear-gradient(90deg, #eee 25%, #f5f5f5 37%, #eee 63%);
        background-size: 400% 100%;
        animation: skeleton-loading 1.4s ease infinite;
      }

      @keyframes skeleton-loading {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }

      .skeleton-img {
        height: 220px;
        width: 100%;
        border-radius: 6px;
      }

      .skeleton-text {
        height: 14px;
        width: 100%;
        border-radius: 4px;
        margin-bottom: 10px;
      }

      .skeleton-text.short {
        width: 60%;
      }
    </style>
  </head>

  <body class="bg-light">
    <div class="d-flex vh-100">
      <!-- Sidebar -->
      <nav
        id="sidebar"
        class="sidebar text-white p-4 flex-shrink-0"
        style="width: 260px; overflow-y: auto"
      >
        <div class="mb-4">
          <img
            src="../../../asset/images/ANT.png"
            alt="Logo"
            class="img-fluid w-75"
          />
        </div>

        <ul class="list-unstyled">
          <li class="mb-2">
            <a
              href="#"
              class="nav-link text-white d-flex align-items-center p-2 rounded"
              data-page="dashboard"
              style="background: rgba(255, 255, 255, 0.1)"
            >
              <i class="fas fa-home me-2"></i> Dashboard
            </a>
          </li>

          <li class="mb-2">
            <a
              class="nav-link d-flex justify-content-between align-items-center p-2 rounded text-white-50"
              data-bs-toggle="collapse"
              href="#articleMenu"
            >
              <span> <i class="fas fa-file-alt me-2"></i> My Article </span>
              <i class="fas fa-chevron-down article-chevron"></i>
            </a>

            <div class="collapse ps-3 mt-1" id="articleMenu">
              <a
                href="#"
                class="nav-link text-white-50 p-2 rounded mb-1"
                data-page="articleList"
              >
                All Article
              </a>

              <a
                href="#"
                class="nav-link text-white-50 p-2 rounded"
                data-page="articleCreate"
              >
                Create Article
              </a>
            </div>
          </li>

          <li class="mb-2">
            <a
              href="#"
              class="nav-link text-white-50 d-flex align-items-center p-2 rounded"
              data-page="category"
            >
              <i class="fas fa-list me-2"></i> Category
            </a>
          </li>

          <li class="mb-2">
            <a
              href="#"
              class="nav-link text-danger d-flex align-items-center p-2 rounded"
              data-page="logout"
            >
              <i class="fas fa-sign-out-alt me-2"></i> Logout
            </a>
          </li>
        </ul>
      </nav>

      <!-- Main -->
      <div class="d-flex flex-column flex-grow-1">
        <!-- Header -->
        <header
          class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center"
        >
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-primary d-md-none" id="toggleBtn">
              <i class="fas fa-bars"></i>
            </button>

            <h4 id="pageTitle" class="mb-0 fw-bold text-darkblue">Dashboard</h4>
          </div>

          <div class="d-flex align-items-center gap-2">
            <div
              class="rounded-circle bg-darkblue text-white d-flex align-items-center justify-content-center fw-bold"
              style="width: 40px; height: 40px"
            >
              TT
            </div>
            <span class="d-none d-sm-inline">Pich Lyheang</span>
          </div>
        </header>

        <!-- Content -->
        <main class="flex-grow-1 overflow-auto p-4">
          <div id="dashboardtool" class="container-fluid px-0">
            <div class="row">
              <div class="col-6 mb-4">
                <div class="form-control">
                  <div class="d-flex align-items-center">
                    <i class="fas fa-search text-secondary"></i>
                    <input
                      type="text"
                      id="searchInput"
                      class="form-control border-0 shadow-none"
                      placeholder="Search articles..."
                    />
                  </div>
                </div>
              </div>
              <div class="col-6 mb-4 d-flex justify-content-end">
                <button
                  id="createBtn"
                  class="btn bg-darkblue text-white bg-hover-darkblue"
                >
                  <a
                    href="#"
                    class="nav-link"
                    data-page="articleCreate"
                    id="nav-create-article"
                  >
                    <i class="fas fa-plus-circle me-2"> </i>
                    Create Article
                  </a>
                </button>
              </div>
            </div>
          </div>
          <div id="page-dashboard" class="page-content">
            <div id="article" class="row g-3"></div>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <!-- Left: range info -->
              <div id="rangeInfo" class="text-muted small">
                Showing 0–0 of 0
              </div>

              <!-- Right: pagination controls -->
              <div class="d-flex align-items-center gap-3">
                <button id="prevBtn" class="btn btn-outline-secondary">
                  Previous
                </button>

                <span id="pageInfo" class="fw-medium"> Page 1 of 1 </span>

                <button id="nextBtn" class="btn bg-darkblue text-white">
                  Next
                </button>
              </div>
            </div>
          </div>

          <div id="page-articleList" class="page-content d-none"></div>
          <div id="page-articleCreate" class="page-content d-none"></div>
          <div id="page-category" class="page-content d-none"></div>
        </main>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../../scripts/dashboard_scripts/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
