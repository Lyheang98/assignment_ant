<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --text-primary: #2d3436;
            --text-secondary: #999;
            --text-muted: #b8b8b8;
            --sidebar-bg: #022a57;
        }

        body {
            color: var(--text-primary);
        }

        /* Remove link underlines */
        a {
            text-decoration: none !important;
        }

        .btn-link {
            text-decoration: none !important;
        }

        .btn-link:hover {
            text-decoration: none !important;
        }

        /* Sidebar styling */
        .sidebar {
            background-color: var(--sidebar-bg) !important;
        }

        /* Mobile sidebar slide animation */
        @media (max-width: 991px) {
            .sidebar {
                position: fixed !important;
                left: 0 !important;
                top: 0 !important;
                height: 100vh !important;
                z-index: 1050 !important;
                transform: translateX(-100%) !important;
                transition: transform 0.3s ease !important;
                width: 250px !important;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2) !important;
            }

            .sidebar.show {
                transform: translateX(0) !important;
            }

            .toggle-btn {
                display: block !important;
            }
        }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex vh-100">
        <!-- Sidebar -->
        <nav class="text-white sidebar p-4 flex-shrink-0" id="sidebar" style="width: 260px; overflow-y: auto;">
            <div class="h5 fw-bold mb-3 d-flex align-items-center">
                <i class="fas fa-book me-2"></i>Blog
            </div>
            
            <ul class="list-unstyled">
                <li class="mb-2">
                    <a href="#" class="btn btn-link text-white text-start w-100 d-flex align-items-center p-2 rounded nav-link" data-page="dashboard" style="background: rgba(255, 255, 255, 0.1);">
                        <i class="fas fa-home me-2" style="width: 20px;"></i>Dashboard
                    </a>
                </li>
                <li class="mb-2">
                    <a href="#" class="btn btn-link text-white-50 text-start w-100 d-flex align-items-center p-2 rounded nav-link" data-page="article">
                        <i class="fas fa-file-alt me-2" style="width: 20px;"></i>My Article
                    </a>
                </li>
                <li class="mb-2">
                    <a href="#" class="btn btn-link text-white-50 text-start w-100 d-flex align-items-center p-2 rounded nav-link" data-page="category">
                        <i class="fas fa-list me-2" style="width: 20px;"></i>Category
                    </a>
                </li>
                <li class="mb-2 ">
                    <a href="#" class="btn btn-link text-danger text-start w-100 d-flex align-items-center p-2 rounded nav-link" data-page="logout">
                        <i class="fas fa-sign-out-alt me-2" style="width: 20px;"></i>Logout
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="d-flex flex-column flex-grow-1">
            <!-- Header -->
            <header class="bg-white border-bottom py-3 px-4 d-flex align-items-center justify-content-between gap-3">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-primary d-md-none toggle-btn" id="toggleBtn">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="h3 fw-bold text-dark mb-0" id="pageTitle">All articles</h1>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center text-white fw-bold" style="width: 40px; height: 40px;">TT</div>
                    <span class="d-none d-sm-inline small" style="color: var(--text-primary);">Tann Tongei</span>
                </div>
            </header>

            <!-- // content area -->
            <div class="flex-grow-1 overflow-y-auto p-4" id="contentArea">
                <!-- Dashboard Page -->
                <div id="page-dashboard" class="page-content">
                    <div class="alert alert-info" role="alert">
                        Dashboard content goes here
                    </div>
                </div>
                <div id="page-article" class="page-content d-none"></div>
                <div id="page-category" class="page-content d-none"></div>
            </div>
        </div>
    </div>
    <script src="../../scripts/dashboard_scripts/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
