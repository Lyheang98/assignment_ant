<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>article create</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <style>
      body {
        background-color: #f8f9fa;
      }
      .form-wrapper {
        max-width: 1000px;
        margin: 60px auto;
      }
      .btn-publish {
        background-color: #212529;
        color: #fff;
        border-radius: 8px;
        padding: 10px 20px;
      }
      .btn-publish:hover {
        background-color: #000;
        color: #fff;
      }
      /* textarea {
        resize: vertical;
      } */
      span{
        color: red;
      }
    </style>
  
  </head>
  <body>

    <div class="container form-wrapper">

      <h2 class="mb-4">Article Create</h2>

      <form id="my-form" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="title" class="form-label">
            Title <span class="text-danger">*</span>
          </label>
          <input type="text" id="title" name="title" class="form-control">
          <span id="titleError"></span>
        </div>

        <div class="mb-3">
          <label for="category" class="form-label">
            Category <span class="text-danger">*</span>
          </label>
          <select id="category" name="category" class="form-select" >
            <option value="" selected disabled>Select category</option>
            <option value="technology">Technology</option>
            <option value="education">Education</option>
            <option value="business">Business</option>
          </select>
          <span id="categoryError"></span>
        </div>

          <div class="mb-3">
            <label for="thumbnail" class="form-label">
              Thumbnail
            </label>
            <input type="file" id="thumbnail" name="thumbnail" class="form-control">
          </div>

          <div class="mb-4">
            <label for="content" class="form-label">
              Content <span class="text-danger">*</span>
            </label>
            <textarea id="content" name="content" class="form-control" rows="8" placeholder="Write content here..."></textarea>
          </div>
          <span id="contentError"></span>

          <div class="d-flex justify-content-between">
            <a href="article_list.html" class="btn btn-outline-secondary">
              ← Back to Articles
            </a>
            <button type="submit" class="btn btn-publish" onclick="getPublish()">
              <i class="bi bi-telegram"></i> Publish Now
            </button>
          </div>
      </form>
    </div>

      
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="../../scripts/article_scripts/article_create.js"></script>

    </script>
  </body>
</html>
