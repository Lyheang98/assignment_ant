<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --text-primary: #2d3436;
        --text-secondary: #999;
        --text-muted: #b8b8b8;
        --sidebar-bg: #022a57;
      }
    </style>
  </head>
  <body>
    <div class="container px-5 mt-4">
      <!-- Title + Button -->
      <h4 class="fw-bold">
        All Categories
      </h4>
      <div class="d-flex justify-content-end align-items-center mb-3">
        <button class="btn btn-primary px-4" id="createNewBtn">
          Create New Category
        </button>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="card-body p-0">
          <table class="table mb-0 table-hover">
            <thead>
              <tr class="border-bottom" style="color: var(--text-primary)">
                <th class="ps-4">Name</th>
                <th class="text-end pe-4">Actions</th>
              </tr>
            </thead>
            <tbody class="fw-medium" id="displayCategory">
              <!--====row===-->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Create Modal -->
    <div
      class="modal fade"
      id="createModal"
      tabindex="-1"
      aria-labelledby="createModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="createModalLabel">
              Create New Category
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label for="categoryName" class="form-label"
                >Category Name <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="categoryName"
                placeholder="Enter category name"
              />
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              id="btnCreate"
              class="btn btn-primary"
              onclick="btnCreate()"
            >
              Create
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Edit Category</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="editCategoryName" class="form-label"
                >Category Name <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="editCategoryName"
                placeholder="Enter category name"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button id="btnEdit" class="btn btn-primary" onclick="btnEdit()">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title text-danger">Confirm Delete</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            Are you sure you want to delete this category? <br />
            <small class="text-muted">This action cannot be undone.</small>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
              Yes, Delete
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="">
      <div class="modal fade" id="alertModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="alertModalTitle"></h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body" id="alertModalBody"></div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-primary"
                data-bs-dismiss="modal"
              >
                OK
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================scr======================= -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../scripts/category_scripts/category.js"></script>
    <!-- ====================================== -->
  </body>
</html>
